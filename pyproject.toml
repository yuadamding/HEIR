[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heir-spatial"
version = "0.12.0"
description = "Specimen-personalized spatial expression prediction"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "HEIR contributors"}]
dependencies = [
  "numpy>=1.23,<3",
  "torch>=2.1",
]

[project.scripts]
heir = "heir.personalized.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
htapp = [
  "pillow>=10",
  "anndata>=0.10,<0.13",
  "pandas>=1.5",
  "scipy>=1.10",
  "pyarrow>=14",
  "zarr>=2.17,<3",
]
encoders = [
  "safetensors>=0.4",
  "timm>=1.0.15,<2",
  "torchvision>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["heir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
